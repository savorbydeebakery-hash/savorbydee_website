name: Uptime check

# A free uptime monitor (2026-10-27, go-live plan item 11). Every 10 minutes
# it loads the live site the way a customer would. If something is down, the
# run fails and GitHub emails whoever last changed this file's schedule (the
# default for failed scheduled workflows: GitHub → Settings → Notifications →
# Actions controls it).
#
# Each check gets three tries, 20 seconds apart, so one slow moment or a
# single Cloudflare 1102 blip doesn't raise an alarm; three in a row does.
#
# Note: GitHub pauses scheduled workflows in a repository with no activity for
# 60 days. Any push restarts them; so does "Enable workflow" in the Actions tab.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: uptime
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE: https://savorbydee.in
    steps:
      - name: Check the live site
        shell: bash
        run: |
          fail=0
          try() {
            local name="$1"; shift
            for attempt in 1 2 3; do
              if "$@"; then echo "OK   $name"; return 0; fi
              echo "     $name failed (try $attempt)"; sleep 20
            done
            echo "DOWN $name"; echo "- **$name** is down" >> "$GITHUB_STEP_SUMMARY"; fail=1
          }

          page() { # a page loads, and isn't Cloudflare's error page
            local body code
            body=$(curl -s -m 30 -w '\n%{http_code}' "$SITE$1") || return 1
            code=$(tail -n1 <<<"$body")
            [ "$code" = "200" ] && ! grep -qiE 'error 1102|exceeded resource limits|worker threw exception' <<<"$body"
          }

          orders() { # the order system answers (a deliberately invalid request gets a 400, not a crash)
            local code
            code=$(curl -s -m 30 -o /tmp/o.json -w '%{http_code}' -X POST "$SITE/api/orders" \
              -H 'Content-Type: application/json' \
              -d '{"items":[{"id":"u","menuItemId":"00000000-0000-0000-0000-000000000000","name":"Uptime","unitPriceCents":100,"quantity":1,"selections":{},"lineTotalCents":100}],"totalCents":100,"fulfillment":"pickup","requestedSlot":"not-a-date","guest":{"name":"Uptime Check","phone":"9000000000"}}')
            [ "$code" = "400" ] && grep -q '"error"' /tmp/o.json
          }

          alerts() { # staff phone alerts can start (the push key is served)
            curl -sf -m 30 "$SITE/api/push/key" | grep -q publicKey
          }

          echo "## Uptime check $(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_STEP_SUMMARY"
          try "Homepage" page /
          try "Menu" page /menu
          try "Order system" orders
          try "Staff alerts" alerts
          [ "$fail" = 0 ] && echo "All good." >> "$GITHUB_STEP_SUMMARY"
          exit $fail
